# @package _global_
# CartPoleContinuous-v0 config for IQ-Learn (SAC backbone).
# Uses the sign-based action adapter defined in envs/cartpole_continuous.py.
# The expert demo .pkl is generated by expert_collect_sac.py and lives in
#   experts/CartPoleContinuous-v0_K{K}.pkl
# K is the number of expert trajectories; the active K is picked by the
# `env.demo` field below (override at run time, e.g. env.demo=CartPoleContinuous-v0_K5).

env:
  name: CartPoleContinuous-v0
  demo: CartPoleContinuous-v0_K20
  learn_steps: 3e4
  eval_interval: 1e3
  eps_steps: 500
  replay_mem: 50000
  initial_mem: 1000

expert:
  demos: 20
  subsample_freq: 1

eval:
  threshold: 500
