# @package _global_

agent:
  name: sac
  _target_: agent.sac.SAC
  obs_dim: 0
  action_dim: 0

  init_temp: 1e-2

  alpha_lr: 3e-4
  alpha_betas: [0.9, 0.999]

  actor_lr: 3e-4
  actor_betas: [0.9, 0.999]
  actor_update_frequency: 1

  critic_lr: 3e-4
  critic_betas: [0.9, 0.999]
  critic_tau: 0.005
  critic_target_update_frequency: 1

  learn_temp: false
  vdice_actor: false

q_net:
  _target_: agent.sac_models.DoubleQCritic
  hidden_dim: 256
  hidden_depth: 2

diag_gaussian_actor:
  hidden_dim: 256
  hidden_depth: 2
  log_std_bounds: [-5, 2]